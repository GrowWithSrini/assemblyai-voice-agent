name: Deploy to Azure Container Apps

# Serverless container host: scales to zero, HTTPS + hostname included, no VM to run.
# One-time setup (OIDC login, GitHub secrets/variables) is in DEPLOY.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  id-token: write # federated OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: voice-agent-rg
  LOCATION: eastus
  APP_NAME: assemblyai-voice-agent
  ENVIRONMENT: voice-agent-env
  TARGET_PORT: "8000"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare CLI
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none

      - name: Build image in the cloud & deploy revision
        run: |
          az containerapp up \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$ENVIRONMENT" \
            --location "$LOCATION" \
            --source . \
            --ingress external \
            --target-port "$TARGET_PORT" \
            --min-replicas 0 \
            --max-replicas 2 \
            -o none

      - name: Set API key (secret + env ref)
        run: |
          az containerapp secret set \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --secrets assemblyai-api-key="${{ secrets.ASSEMBLYAI_API_KEY }}" -o none
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --set-env-vars ASSEMBLYAI_API_KEY=secretref:assemblyai-api-key -o none

      - name: Report URL
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
